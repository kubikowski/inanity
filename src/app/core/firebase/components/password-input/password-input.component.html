<mat-form-field>
	<mat-label>{{ label() }}</mat-label>

	<input matInput [type]="inputType()"
		   [id]="autocomplete()" [autocomplete]="autocomplete()"
		   [formControl]="passwordControl()"/>

	<button type="button" mat-icon-button matIconSuffix
			[matTooltip]="visibilityTooltip()"
			(click)="toggleVisibility()">
		<mat-icon>{{ visibilityIcon() }}</mat-icon>
	</button>

	@if (passwordControl().getError('required')) {
		<mat-error>{{ requiredMessage() }}</mat-error>
	}
</mat-form-field>
