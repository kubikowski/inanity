@switch (configuration().attribute) {
	@case ('flat') {
		<button type="button"
				mat-flat-button
				[class]="configuration().color"
				[disabled]="!configuration().enabled()"
				[hidden]="!configuration().visible()"
				(click)="doAction()">

			<span>{{ configuration().text() }}</span>

			@if (configuration().icon?.() && configuration().iconAlignment !== 'right') {
				<mat-icon [class.fill]="configuration().iconFill">{{ configuration()?.icon() }}</mat-icon>
			}
			@if (configuration().icon?.() && configuration().iconAlignment === 'right') {
				<mat-icon iconPositionEnd [class.fill]="configuration().iconFill">{{ configuration()?.icon() }}</mat-icon>
			}
		</button>
	}
	@case ('stroked') {
		<button type="button"
				mat-stroked-button
				[class]="configuration().color"
				[disabled]="!configuration().enabled()"
				[hidden]="!configuration().visible()"
				(click)="doAction()">

			<span>{{ configuration().text() }}</span>

			@if (configuration().icon?.() && configuration().iconAlignment !== 'right') {
				<mat-icon [class.fill]="configuration().iconFill">{{ configuration()?.icon() }}</mat-icon>
			}
			@if (configuration().icon?.() && configuration().iconAlignment === 'right') {
				<mat-icon iconPositionEnd [class.fill]="configuration().iconFill">{{ configuration()?.icon() }}</mat-icon>
			}
		</button>
	}
}
